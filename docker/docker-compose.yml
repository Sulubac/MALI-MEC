version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notaryos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notaryos2024}
      POSTGRES_DB: notaryos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notaryos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notaryos-redis
    volumes:
      - redis_data:/data
    networks:
      - notaryos-network
    restart: unless-stopped

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: notaryos-backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-notaryos2024}@postgres:5432/notaryos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-notaryos-jwt-secret-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-notaryos-refresh-secret-prod}
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - notaryos-network
    restart: unless-stopped
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: notaryos-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000/api/v1}
    depends_on:
      - backend
    networks:
      - notaryos-network
    restart: unless-stopped
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: notaryos-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - notaryos-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  notaryos-network:
    driver: bridge
