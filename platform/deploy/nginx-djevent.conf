# Bloc Nginx pour djevent.techiftiin.online -> application Node (port 4300)
# Fichier à placer dans : /etc/nginx/sites-available/djevent.techiftiin.online
# Puis l'activer (voir DEPLOY-VPS.md). HTTPS sera ajouté automatiquement par certbot.

server {
    listen 80;
    listen [::]:80;
    server_name djevent.techiftiin.online;

    # Journalisation
    access_log /var/log/nginx/djevent.access.log;
    error_log  /var/log/nginx/djevent.error.log;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
